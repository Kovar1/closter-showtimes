name: record

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, on quiet minutes (times are UTC)
  workflow_dispatch:                # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: recorder                   # never run two at once
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python recorder.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Recording $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git pull --rebase
          git push
